[project]
name = "jarvis-hud"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "psutil>=5.9",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "sounddevice>=0.4",
  "numpy>=1.26",
  "faster-whisper>=1.0",
  # Local TTS fallback: the ElevenLabs free tier runs out monthly, and an
  # assistant you talk to going silent is a bad failure mode.
  "pyttsx3>=2.90",
  "google-api-python-client>=2.0",
  "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
